<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/assets/favicon.svg" type="image/svg+xml" />
		<!-- The default Lily theme. The theme picker appends its own stylesheet
		     link after this one, so a reader's choice wins without a flash of
		     unstyled content on first paint. -->
		<link rel="stylesheet" href="%sveltekit.assets%/assets/themes/light.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/assets/style.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
